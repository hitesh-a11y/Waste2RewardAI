name: Build Waste2Reward AI APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: Waste2RewardAI
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: Waste2RewardAI
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List output
        run: find . -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waste2RewardAI-debug-apk
          path: Waste2RewardAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
